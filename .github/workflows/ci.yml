name: PadhaiMode CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: Start server and smoke-test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start PadhaiMode
        env:
          PORT: 3000
          JWT_SECRET: ci-test-secret
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health; then
              echo
              echo Server is up
              exit 0
            fi
            sleep 1
          done
          echo Server failed to start
          cat server.log
          exit 1
      - name: Health, login, marketplace
        run: |
          curl -sf http://127.0.0.1:3000/api/health | grep -q '"ok":true'
          curl -sf -X POST http://127.0.0.1:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"adhrit@padhaimode.app","password":"student123"}' | grep -q '"token"'
          curl -sf http://127.0.0.1:3000/api/documents | grep -q '"documents"'
          curl -sf http://127.0.0.1:3000/ | grep -q PadhaiMode
      - name: Server logs on failure
        if: failure()
        run: cat server.log || true
