<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PadhaiMode — Focus. Learn. Level Up.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050508;
      --surface: #0f1117;
      --surface-2: #161922;
      --border: #252836;
      --text: #e8eaef;
      --muted: #8b90a0;
      --blue: #6b9eff;
      --blue-soft: #8bb0ff;
      --silver: #c5cdd9;
      --accent-soft: rgba(107, 158, 255, 0.12);
      --success: #34d399;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 45% at 50% -15%, rgba(107, 158, 255, 0.14), transparent),
        radial-gradient(ellipse 50% 35% at 85% 100%, rgba(80, 120, 200, 0.07), transparent);
      pointer-events: none;
      z-index: 0;
    }

    /* Top-left logo — refreshes page */
    .top-logo {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: opacity 0.2s;
      padding: 6px 10px 6px 6px;
      border-radius: 12px;
    }

    .top-logo:hover { opacity: 0.85; }
    .top-logo:active { opacity: 0.7; }

    .logo-svg {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
    }

    .top-logo-text {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #c5cdd9 0%, #8bb0ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .container {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px 40px;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
    }

    /* Center brand */
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      display: block;
    }

    .brand-title {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #e8eaef 0%, #8bb0ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .brand-tagline {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Card */
    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
    }

    .tabs {
      display: flex;
      background: var(--surface-2);
      border-radius: 11px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .tab.active {
      background: linear-gradient(135deg, #1a2030 0%, #1e2740 100%);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(107, 158, 255, 0.15);
    }

    .tab:hover:not(.active) { color: var(--text); }

    .form { display: none; }
    .form.active { display: block; }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .field input::placeholder { color: #4a5060; }

    .field input:focus {
      border-color: rgba(107, 158, 255, 0.5);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #8bb0ff 0%, #6b9eff 50%, #5a8aef 100%);
      color: #0a0c12;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn-primary:active { transform: translateY(0); }

    .hint {
      text-align: center;
      margin-top: 18px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 11px;
      border-radius: 9px;
      font-size: 0.85rem;
      text-align: center;
    }

    .message.success {
      display: block;
      background: rgba(52, 211, 153, 0.1);
      color: #6ee7b7;
      border: 1px solid rgba(52, 211, 153, 0.25);
    }

    .message.error {
      display: block;
      background: rgba(248, 113, 113, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(248, 113, 113, 0.25);
    }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 20px;
      color: #3d4252;
      font-size: 0.78rem;
    }

    @media (max-width: 480px) {
      .top-logo { top: 14px; left: 12px; }
      .top-logo-text { font-size: 0.95rem; }
      .container { padding-top: 70px; }
      .card { padding: 24px 18px; }
      .brand-logo { width: 60px; height: 60px; }
    }
  </style>
</head>
<body>
  <!-- Top-left logo refreshes the page -->
  <a href="javascript:location.reload()" class="top-logo" title="Refresh">
    <svg class="logo-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="pGrad" x1="8" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse">
          <stop stop-color="#c5cdd9"/>
          <stop offset="0.45" stop-color="#8bb0ff"/>
          <stop offset="1" stop-color="#5a8aef"/>
        </linearGradient>
      </defs>
      <!-- Angular modern P matching the selected logo -->
      <path d="M12 8 L12 40 L18 40 L18 28 L28 28 C36 28 40 23 40 17 C40 11 36 8 28 8 L12 8 Z M18 13 L27 13 C32 13 34 14.5 34 17.5 C34 20.5 32 22 27 22 L18 22 L18 13 Z" fill="url(#pGrad)"/>
    </svg>
    <span class="top-logo-text">PadhaiMode</span>
  </a>

  <div class="container">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="pGrad2" x1="8" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse">
            <stop stop-color="#c5cdd9"/>
            <stop offset="0.45" stop-color="#8bb0ff"/>
            <stop offset="1" stop-color="#5a8aef"/>
          </linearGradient>
        </defs>
        <path d="M12 8 L12 40 L18 40 L18 28 L28 28 C36 28 40 23 40 17 C40 11 36 8 28 8 L12 8 Z M18 13 L27 13 C32 13 34 14.5 34 17.5 C34 20.5 32 22 27 22 L18 22 L18 13 Z" fill="url(#pGrad2)"/>
      </svg>
      <h1 class="brand-title">PadhaiMode</h1>
      <p class="brand-tagline">Focus. Learn. Level Up.</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" data-tab="signin" onclick="switchTab('signin')">Sign In</button>
        <button class="tab" data-tab="signup" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <form class="form active" id="signin-form" onsubmit="handleSignIn(event)">
        <div class="field">
          <label for="signin-email">Email</label>
          <input type="email" id="signin-email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="signin-password">Password</label>
          <input type="password" id="signin-password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
        <div class="message" id="signin-message"></div>
      </form>

      <form class="form" id="signup-form" onsubmit="handleSignUp(event)">
        <div class="field">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="Create a strong password" required minlength="6" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="signup-confirm">Confirm Password</label>
          <input type="password" id="signup-confirm" placeholder="Repeat password" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
        <div class="message" id="signup-message"></div>
      </form>

      <p class="hint">Email-only signup · No full name required</p>
    </div>
  </div>

  <footer>PadhaiMode · Focus. Learn. Level Up.</footer>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
      document.getElementById(tab === 'signin' ? 'signin-form' : 'signup-form').classList.add('active');
      document.getElementById('signin-message').className = 'message';
      document.getElementById('signup-message').className = 'message';
    }

    function handleSignIn(e) {
      e.preventDefault();
      const email = document.getElementById('signin-email').value.trim();
      const password = document.getElementById('signin-password').value;
      const msg = document.getElementById('signin-message');
      if (email && password) {
        msg.textContent = 'Signed in successfully (demo). Connect real auth next.';
        msg.className = 'message success';
      } else {
        msg.textContent = 'Please fill in all fields.';
        msg.className = 'message error';
      }
    }

    function handleSignUp(e) {
      e.preventDefault();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      const msg = document.getElementById('signup-message');
      if (password !== confirm) {
        msg.textContent = 'Passwords do not match.';
        msg.className = 'message error';
        return;
      }
      if (password.length < 6) {
        msg.textContent = 'Password must be at least 6 characters.';
        msg.className = 'message error';
        return;
      }
      msg.textContent = 'Account created (demo). Connect real auth next.';
      msg.className = 'message success';
    }
  </script>
</body>
</html>
